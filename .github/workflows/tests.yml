name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TensorFlow 2.13 supports 3.8 to 3.11; the pinned stack is built for it.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # tensorflow-cpu rather than tensorflow: the GPU build pulls ~2 GB of
          # CUDA wheels that no runner here can use.
          pip install "tensorflow-cpu==2.13.0"
          pip install flask==2.3.3 werkzeug==2.3.8 "asgiref>=3.7.2" "numpy<2" Pillow boto3 redis \
                      prometheus-client scipy psutil requests aiohttp pytest

      - name: Run tests
        env:
          # The suite sets its own keys per test; an empty value here only proves
          # the service does not pick up a key from the environment by accident.
          VALID_API_KEYS: ""
        run: pytest tests -q
